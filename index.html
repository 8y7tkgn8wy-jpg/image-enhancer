<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片高清化 · AI 超分辨率</title>
  <meta name="description" content="把模糊、低分辨率图片一键变高清（1080P/2K/4K/8K），AI 重建细节，纯本地处理，原图不上传。">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <circle cx="12" cy="12" r="1.2" fill="currentColor"/>
        <path d="M12 2.2v1.6M12 20.2v1.6M2.2 12h1.6M20.2 12h1.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <h1>图片高清化</h1>
    </div>
    <p class="tagline">AI 超分辨率 · 模糊图一键变高清 · 纯本地处理，原图不上传</p>
  </header>

  <main class="container">
    <section id="uploadSection" class="card upload-card">
      <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="选择或拖入图片">
        <input type="file" id="fileInput" accept="image/*" hidden>
        <svg class="dz-icon" viewBox="0 0 24 24" width="44" height="44" aria-hidden="true">
          <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <p class="dz-title">拖入图片，或点击选择</p>
        <p class="dz-sub">支持 JPG / PNG / WebP / BMP 等常见格式</p>
      </div>
      <p class="privacy-note">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
          <rect x="5" y="10" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.6"/>
        </svg>
        图片仅在本机浏览器内处理，不会上传到任何服务器
      </p>
    </section>

    <section id="workspaceSection" class="workspace" hidden>
      <div class="workspace-grid">
        <div class="card preview-card">
          <div class="card-header">
            <h2>高清预览</h2>
            <span class="preview-hint">移动鼠标查看放大对比</span>
          </div>
          <div id="previewWrap" class="preview-wrap">
            <img id="resultPreview" class="result-preview" alt="高清结果" hidden>
            <canvas id="loupe" class="loupe" width="260" height="260" hidden></canvas>
            <p id="previewPlaceholder" class="placeholder">选择图片并处理后，在此预览高清结果</p>
          </div>
          <p id="dimensionsInfo" class="dimensions-info"></p>
        </div>

        <aside class="card controls-card">
          <h2>高清设置</h2>

          <div class="field">
            <span class="field-label">处理模式</span>
            <div class="segmented" role="radiogroup" aria-label="处理模式">
              <button id="modeAI" class="seg active" type="button" role="radio" aria-checked="true">
                <span class="seg-title">AI 高清</span>
                <span class="seg-desc">重建细节，清晰度最高</span>
              </button>
              <button id="modeFidelity" class="seg" type="button" role="radio" aria-checked="false">
                <span class="seg-title">无损放大</span>
                <span class="seg-desc">不补造细节，不改变元素</span>
              </button>
            </div>
            <p id="modeHint" class="field-hint">AI 重建缺失细节，把小图、模糊图变成真正的高清图；首次使用需下载约 4MB 模型。</p>
          </div>

          <div class="field">
            <label for="tierSelect" class="field-label">目标清晰度</label>
            <select id="tierSelect">
              <option value="1920">1080P（宽边 1920px）</option>
              <option value="2560">2K（宽边 2560px）</option>
              <option value="3840" selected>4K（宽边 3840px）</option>
              <option value="7680">8K（宽边 7680px）</option>
            </select>
            <p id="tierHint" class="field-hint">按图片较长边计算，保持原比例。</p>
          </div>

          <div class="field">
            <label for="formatSelect" class="field-label">输出格式</label>
            <select id="formatSelect">
              <option value="png">PNG（无损，推荐）</option>
              <option value="jpeg">JPEG（体积更小）</option>
            </select>
          </div>

          <div class="field" id="jpegField" hidden>
            <label for="qualityRange" class="field-label">JPEG 质量 <span id="qualityValue" class="range-value">90%</span></label>
            <input type="range" id="qualityRange" min="50" max="100" value="90">
          </div>

          <button id="processBtn" class="btn-primary" type="button">生成高清图</button>
          <button id="downloadBtn" class="btn-secondary" type="button" disabled>下载高清图</button>
          <div id="statusBar" class="status-bar" role="status" aria-live="polite"></div>
        </aside>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>使用 TensorFlow.js 与 UpscalerJS（ESRGAN）在本机浏览器运行；AI 模型随站托管，无需第三方 CDN。</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
